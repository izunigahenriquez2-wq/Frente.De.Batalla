<!doctype html><html lang="es"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>Frente de Batalla</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,800;1,800&family=Chakra+Petch:wght@600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout concept: a competitive arena. A battle-field backdrop sits fixed behind everything;
   content floats on navy "message windows" (Mystery Dungeon style) with broadcast-style condensed headings. */
:root{
  --bg:#0a1a45; --ink:#f3f7ff; --mute:#a9bde8; --line:#e8eeff;
  --win1:#18368f; --win2:#0b2057; --win3:#071538;
  --gold:#ffcb05; --gold2:#ff9d00; --red:#ff4338; --green:#34d77a; --cy:#38d6ff;
  --f-d:'Barlow Condensed','Arial Narrow',Impact,sans-serif;
  --f-b:'Nunito','Segoe UI',system-ui,sans-serif;
  --f-u:'Chakra Petch','Segoe UI',monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:600 16px/1.45 var(--f-b);padding-inline:16px;padding-block:0 40px;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
b,strong{font-weight:800}
#bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:#071338}#bg:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(3,9,28,.38));pointer-events:none}
#bg svg{position:absolute;inset:0;width:100%;height:100%}
#bg .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,16,50,.40) 0%,rgba(5,16,50,.12) 38%,rgba(5,16,50,.38) 72%,rgba(5,16,50,.72) 100%);transition:background .4s}
body:not(.home) #bg .shade{background:linear-gradient(180deg,rgba(5,16,50,.62),rgba(5,16,50,.82))}
.cl1{animation:drift 90s linear infinite}.cl2{animation:drift 140s linear infinite reverse}
@keyframes wave{from{transform:translateX(-12px)}to{transform:translateX(12px)}}
.wv{animation:wave 7s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-60px)}to{transform:translateX(60px)}}
.fighter{position:absolute;pointer-events:none;filter:drop-shadow(0 14px 10px rgba(0,0,0,.45));transition:opacity .4s}
.fighter .mon{width:100%}
#fA{left:2%;bottom:6%;width:min(40vw,330px);transform:scaleX(-1)}
#fB{right:6%;top:30%;width:min(26vw,210px)}
body:not(.home) .fighter{opacity:.0}
body.home .fighter{opacity:.8}
#app{max-width:980px;margin:0 auto;padding-block:18px 32px;min-height:100vh}
#app.narrow{max-width:780px}
.mon{display:block;aspect-ratio:1;background-repeat:no-repeat;background-size:1200% 1200%;width:100%}
.mon.sil{filter:brightness(0) drop-shadow(0 0 5px rgba(110,200,255,.85))}
.mon.gray{filter:grayscale(1) brightness(.7)}
/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:4px 22px}
.logo{font:italic 800 clamp(24px,4.5vw,32px)/1 var(--f-d);text-transform:uppercase;letter-spacing:.03em;text-shadow:0 2px 0 rgba(0,0,0,.3);cursor:pointer;background:none;border:0;padding:0;color:#fff;display:flex;align-items:center;gap:6px}
.logo i{font-style:italic;color:var(--gold)}
.logo .bolt{display:inline-block;width:.7em;height:.95em;background:linear-gradient(160deg,var(--gold),var(--gold2));clip-path:polygon(55% 0,100% 0,60% 42%,95% 42%,25% 100%,42% 55%,0 55%);margin-right:2px}
/* windows */
.win{background:linear-gradient(180deg,rgba(24,54,143,.92),rgba(11,32,87,.94));border:2px solid rgba(232,238,255,.28);border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.08);padding:18px}
.win.soft{background:rgba(7,21,56,.8);border-color:rgba(232,238,255,.2);backdrop-filter:blur(3px)}
h1,h2,h3{font-family:var(--f-d);text-transform:uppercase;letter-spacing:.03em;margin:0;line-height:1.1;font-weight:800}
h1{font-size:clamp(30px,6vw,46px)}h2{font-size:clamp(22px,4vw,30px)}h3{font-size:19px;letter-spacing:.04em}
.eyebrow{font:700 12px/1 var(--f-u);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.mute{color:var(--mute)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:8px 22px;border:0;border-radius:10px;font:800 18px/1 var(--f-d);text-transform:uppercase;letter-spacing:.06em;color:#2a1a00;background:linear-gradient(180deg,#ffe066,var(--gold) 60%,var(--gold2));box-shadow:0 3px 0 #a45b00,0 6px 12px rgba(0,0,0,.28);transition:transform .08s,box-shadow .08s,filter .15s}
.btn:hover{filter:brightness(1.06)}.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #a45b00}
.btn.alt{color:#fff;background:linear-gradient(180deg,#4a7bff,#2a52d4);box-shadow:0 3px 0 #14307f,0 6px 12px rgba(0,0,0,.28)}
.btn.red{color:#fff;background:linear-gradient(180deg,#ff6a5c,#d92c20);box-shadow:0 3px 0 #7c120b,0 6px 12px rgba(0,0,0,.28)}
.btn.ghost{color:var(--ink);background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 2px rgba(232,238,255,.55)}
.btn.sm{min-height:38px;padding:6px 14px;font-size:15px}
.btn[disabled]{opacity:.45;pointer-events:none;filter:grayscale(.6)}
.btn.block{width:100%}
/* segmented / chips */
.seg{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-height:40px;padding:6px 14px;border-radius:999px;border:2px solid rgba(232,238,255,.45);background:rgba(255,255,255,.07);font:700 15px/1.1 var(--f-b)}
.chip.on{background:var(--gold);border-color:var(--gold);color:#2a1a00}
.chip.sq{border-radius:8px}
.ty{display:inline-flex;align-items:center;justify-content:center;padding:3px 10px;border-radius:6px;background:var(--c);color:#fff;font:800 13px/1.2 var(--f-u);letter-spacing:.04em;text-transform:uppercase;text-shadow:0 1px 2px rgba(0,0,0,.55);box-shadow:inset 0 -3px 0 rgba(0,0,0,.18);white-space:nowrap}
.ty.lg{padding:8px 16px;font-size:18px;border-radius:8px}
button.ty{border:3px solid transparent;cursor:pointer;min-height:46px;font-size:15px}
button.ty.on{border-color:#fff;transform:scale(1.04);box-shadow:0 0 0 3px var(--gold),0 6px 14px rgba(0,0,0,.45)}
button.ty.used{opacity:.5}
/* home */
.hero{padding-block:0 28px;display:flex;flex-direction:column;gap:12px;max-width:640px}
.hero h1{text-shadow:0 2px 0 rgba(0,0,0,.3)}
.hero h1 em{color:var(--gold);font-style:normal}
.hero p{margin:0;font-size:17px;max-width:52ch;color:#d3def7;text-shadow:0 2px 6px rgba(0,0,0,.6)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:18px}
.gcard{position:relative;text-align:left;padding:0;border:2px solid rgba(232,238,255,.28);border-radius:16px;overflow:hidden;background:linear-gradient(180deg,rgba(24,54,143,.92),rgba(7,21,56,.95));box-shadow:0 10px 28px rgba(0,0,0,.4);transition:transform .15s,box-shadow .15s,border-color .15s;display:flex;flex-direction:column;min-width:0}
.gcard:hover{transform:translateY(-3px);border-color:var(--gold);box-shadow:0 16px 32px rgba(0,0,0,.45)}
.gcard .art{height:156px;position:relative;display:flex;align-items:flex-end;justify-content:center;gap:4px;background:radial-gradient(circle at 50% 120%,rgba(255,203,5,.35),transparent 62%),repeating-linear-gradient(115deg,rgba(255,255,255,.06) 0 14px,transparent 14px 28px)}
.gcard .art .mon{width:96px;margin-bottom:4px}
.gcard .art .q{position:absolute;font:800 80px/1 var(--f-d);color:rgba(255,255,255,.9);text-shadow:0 0 22px #38d6ff}
.gcard .body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.gcard h2{font-size:26px}
.gcard p{margin:0;color:var(--mute);font-size:15px}
.gcard .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.tag{font:700 12px/1 var(--f-u);letter-spacing:.06em;text-transform:uppercase;padding:6px 9px;border-radius:5px;background:rgba(255,255,255,.12)}
.tag.g{background:var(--gold);color:#2a1a00}
.foot{margin-top:32px;font-size:12px;color:#d3def7;text-align:center;text-shadow:0 1px 4px #000,0 0 10px #000}
/* setup */
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.lbl{font:700 12px/1 var(--f-u);letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
input[type=text]{width:100%;min-height:46px;padding:8px 14px;border-radius:8px;border:2px solid rgba(232,238,255,.45);background:#06122f;color:#fff;font-size:17px;font-weight:700}
input[type=text]:focus{border-color:var(--gold);outline:none}
.prow{display:flex;align-items:center;gap:10px}
.av{width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#35569f,#0b1e57);border:3px solid var(--pc,#fff);flex:none;padding:3px;overflow:hidden;display:block}
.av.sm{width:34px;height:34px;border-width:2px;padding:2px}
.acc{border-top:2px solid rgba(255,255,255,.14);padding-top:10px}
.acc summary{cursor:pointer;font:800 17px/1.2 var(--f-d);letter-spacing:.04em;text-transform:uppercase;padding-block:6px;list-style:none}
.acc summary::-webkit-details-marker{display:none}
.acc summary:after{content:'▾';margin-left:8px;color:var(--gold)}
.acc ul{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px;color:#dce6ff}
.code{font:800 clamp(40px,12vw,64px)/1 var(--f-d);letter-spacing:.14em;color:var(--gold);text-shadow:0 3px 0 rgba(0,0,0,.35);text-align:center}
.note{padding:10px 12px;border-radius:8px;background:rgba(255,203,5,.14);border:2px solid rgba(255,203,5,.55);font-size:14px}
.note.bad{background:rgba(255,67,56,.16);border-color:rgba(255,67,56,.7)}
/* game chrome */
.ghead{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.ghead h2{font-size:clamp(22px,4vw,28px)}
.pbar{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:thin}
.pp{flex:none;display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border-radius:999px;background:rgba(7,21,56,.86);border:2px solid rgba(232,238,255,.35);min-width:0}
.pp b{font-size:14px;max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pp em{font:800 17px/1 var(--f-u);font-style:normal;color:var(--gold);min-width:1.2em;text-align:right;font-variant-numeric:tabular-nums}
.pp.on{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,203,5,.4);background:#14307f}
.pp.off,.pp.dead{opacity:.45}
.pp.me:after{content:'TÚ';font:800 10px/1 var(--f-u);background:var(--cy);color:#042;border-radius:4px;padding:3px 5px}
.pmd{position:relative;background:linear-gradient(180deg,#14307f,#0a1c52);border:2px solid rgba(255,255,255,.75);border-radius:12px;padding:14px 16px 18px;box-shadow:0 8px 20px rgba(0,0,0,.35)}
.pmd:after{content:'▼';position:absolute;right:14px;bottom:6px;color:var(--gold);font-size:14px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.pmd .row{align-items:center}
.pmd .big{font:800 24px/1.15 var(--f-d);text-transform:uppercase}
.portrait{width:96px;flex:none;background:radial-gradient(circle,#4c74d6,#102766);border:2px solid rgba(255,255,255,.8);border-radius:12px;padding:4px}
.portrait.lg{width:min(46vw,190px)}
.portrait.sm{width:56px;border-width:2px;border-radius:8px;padding:2px}
.okc{color:var(--green)}.noc{color:var(--red)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.tab{flex:none;min-height:42px;padding:6px 14px;border-radius:8px 8px 0 0;border:2px solid rgba(232,238,255,.4);border-bottom-width:4px;background:rgba(255,255,255,.07);font:800 16px/1 var(--f-d);letter-spacing:.04em;text-transform:uppercase}
.tab.on{background:var(--gold);color:#2a1a00;border-color:var(--gold)}
.qs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:8px}
.q{min-height:46px;padding:8px 12px;text-align:left;border-radius:8px;border:2px solid rgba(232,238,255,.4);background:rgba(255,255,255,.07);font:700 15px/1.25 var(--f-b)}
.q.on{background:var(--cy);color:#012;border-color:#fff}
.q.done{opacity:.4;text-decoration:line-through;pointer-events:none}
.cands{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px}
.cd{content-visibility:auto;contain-intrinsic-size:96px 96px;padding:4px 2px 5px;border-radius:8px;border:2px solid rgba(232,238,255,.3);background:rgba(7,21,56,.7);display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.cd .mon{width:100%;max-width:64px}
.cd span{font-size:11px;line-height:1.1;text-align:center;overflow:hidden;text-overflow:ellipsis;max-width:100%;white-space:nowrap;padding-inline:2px}
.cd.on{background:var(--gold);color:#2a1a00;border-color:#fff;transform:scale(1.05)}
.sticky{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:5}
.log{display:flex;flex-direction:column;gap:6px;font-size:14px;max-height:230px;overflow:auto}
.log div{padding:6px 10px;border-radius:6px;background:rgba(255,255,255,.07)}
.mystery{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.mc{flex:none;width:92px;text-align:center;display:flex;flex-direction:column;gap:3px;align-items:center;font-size:12px}
.mc .portrait{width:78px}
.mc.dead .portrait{border-color:var(--red)}
.mc b{max-width:92px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* autocomplete */
.ac{position:relative;flex:1;min-width:0}
.acl{display:flex;flex-direction:column;margin-top:4px;border-radius:8px;overflow:hidden;background:#06122f;border:2px solid rgba(232,238,255,.5)}
.acl:empty{display:none}
.acl button{display:flex;align-items:center;gap:10px;padding:6px 10px;border:0;border-bottom:1px solid rgba(255,255,255,.12);background:transparent;text-align:left;min-height:46px}
.acl button:hover{background:#14307f}
.acl .mon{width:34px;flex:none}
.timer{position:relative;height:30px;border-radius:999px;background:#06122f;border:3px solid #fff;overflow:hidden}
.timer i{position:absolute;inset:0;width:100%;background:linear-gradient(90deg,var(--green),var(--gold) 60%,var(--red));transform-origin:left;transition:transform .25s linear}
.timer span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:800 16px/1 var(--f-u);text-shadow:0 1px 3px #000}
.gate{text-align:center;padding:30px 16px;display:flex;flex-direction:column;align-items:center;gap:14px}
.gate .av{width:96px;height:96px}
.sc{display:grid;gap:8px}
.res{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px;border-radius:10px;background:rgba(255,255,255,.08)}
.res .mon{width:56px}
.pts{font:800 22px/1 var(--f-u);color:var(--gold)}
.pts.z{color:var(--mute)}
.exs{display:flex;gap:4px;flex-wrap:wrap}
.exs .mon{width:34px}
.combo{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}
.combo b{font:800 28px/1 var(--f-d)}
.pod{display:flex;align-items:flex-end;justify-content:center;gap:10px;min-height:180px}
.pod>div{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;max-width:140px;min-width:0}
.pod .step{width:100%;border-radius:8px 8px 0 0;background:linear-gradient(180deg,var(--gold),var(--gold2));color:#2a1a00;display:flex;align-items:center;justify-content:center;font:800 30px/1 var(--f-d)}
.pod b{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.clues{display:grid;gap:6px}
.clue{display:flex;gap:8px;align-items:center;padding:6px 10px;border-radius:8px;background:rgba(255,255,255,.08)}
.clue b{flex:none;min-width:84px;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clue span{font-weight:800;color:var(--gold);overflow-wrap:anywhere}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.vb{display:flex;align-items:center;gap:8px;padding:8px;border-radius:10px;border:3px solid rgba(232,238,255,.4);background:rgba(255,255,255,.07);min-width:0;text-align:left}
.vb b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vb.on{border-color:var(--gold);background:rgba(255,203,5,.2)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.big-stamp{font:800 clamp(30px,8vw,48px)/1.05 var(--f-d);text-transform:uppercase;text-align:center;text-shadow:0 3px 0 rgba(0,0,0,.35)}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pop{animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
@media(max-width:560px){.btn{font-size:17px;padding-inline:16px}.win{padding:14px}.portrait.lg{width:130px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</style></head><body>

<linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f7ff"/><stop offset="1" stop-color="#b9c7e4"/></linearGradient>

function gwCands(st,tg){
  const filt=[],ex=new Set();
  for(const e of st.log){if(e[2]!==tg)continue;if(e[0]==='q')filt.push([QS[e[3]].f,!!e[4]]);else if(e[0]==='g'&&!e[4])ex.add(e[3]);}
  const gens=st.opts.gens,out=[];
  for(const m of MONS){if(!gens.includes(m.gen)||ex.has(m.id))continue;let ok=true;for(const [f,a] of filt){if(f(m)!==a){ok=false;break}}if(ok)out.push(m);}
  return out;
}
function gwNext(st){
  const n=st.pl.length;let i=st.tu;
  for(let k=0;k<n;k++){i=(i+1)%n;if(st.al[i]&&!st.pl[i].off)break;}
  st.tu=i;st.tEnd=st.opts.tt?Date.now()+st.opts.tt*1000:0;
}
function gwCheck(st){
  const live=st.pl.map((p,i)=>i).filter(i=>st.al[i]&&!st.pl[i].off);
  if(live.length<=1){st.ph='over';st.win=live.length?live[0]:-1;st.tEnd=0;return true}
  return false;
}
G.gw={
  name:'¿Quién es ese Pokémon?',min:2,max:8,
  defOpts:{gens:[1,2,3,4,5,6,7,8,9],tt:0},
  init(pl,opts){return {g:'gw',ph:'lobby',pl,opts:JSON.parse(JSON.stringify(opts)),rev:0,sec:[],al:[],pts:[],tu:0,log:[],win:-1,tEnd:0,cu:0,loc:0}},
  start(st,loc){
    const pool=MONS.filter(m=>st.opts.gens.includes(m.gen));
    st.sec=shuffle(pool).slice(0,st.pl.length).map(m=>m.id);
    st.al=st.pl.map(()=>1);st.pts=st.pl.map(()=>0);st.log=[];st.win=-1;st.tu=0;st.cu=0;st.loc=loc?1:0;
    st.ph=loc?'deal':'play';st.tEnd=0;if(!loc)gwNext0(st);
  },
  actor(st){return st.ph==='deal'?st.cu:st.tu},
  leave(st,i){st.al[i]=st.al[i];if(!gwCheck(st)&&st.tu===i)gwNext(st)},
  reduce(st,a,by){
    if(a.t==='ack'&&st.ph==='deal'){if(by===st.cu){st.cu++;if(st.cu>=st.pl.length){st.ph='play';st.tu=0;st.tEnd=st.opts.tt?Date.now()+st.opts.tt*1000:0}}return}
    if(st.ph!=='play')return;
    if(a.t==='timeout'){if(st.tEnd&&Date.now()>=st.tEnd-80){st.log.push(['t',st.tu,0,0,0]);gwNext(st)}return}
    if(by!==st.tu)return;
    if(a.t==='ask'){
      if(!st.al[a.tg]||a.tg===by||!QS[a.q])return;
      if(st.log.some(e=>e[0]==='q'&&e[2]===a.tg&&e[3]===a.q))return;
      st.log.push(['q',by,a.tg,a.q,QS[a.q].f(BYID[st.sec[a.tg]])?1:0]);gwNext(st);
    }else if(a.t==='guess'){
      if(!st.al[a.tg]||a.tg===by||!BYID[a.id])return;
      const ok=st.sec[a.tg]===a.id;
      st.log.push(['g',by,a.tg,a.id,ok?1:0]);
      if(ok){st.al[a.tg]=0;st.pts[by]++}
      if(!gwCheck(st))gwNext(st);
    }
  }
};
function gwNext0(st){st.tEnd=st.opts.tt?Date.now()+st.opts.tt*1000:0}

function gwLogLine(st,e){
  const P=i=>`<b>${esc(st.pl[i].n)}</b>`;
  if(e[0]==='q')return `${P(e[1])} preguntó a ${P(e[2])}: «${QS[e[3]].l}» → <b class="${e[4]?'okc':'noc'}">${e[4]?'SÍ':'NO'}</b>`;
  if(e[0]==='g')return `${P(e[1])} adivinó que ${P(e[2])} tenía a <b>${BYID[e[3]].n}</b> → <b class="${e[4]?'okc':'noc'}">${e[4]?'¡ACIERTO!':'Falló'}</b>`;
  return `${P(e[1])} se quedó sin tiempo.`;
}

/* ===================== GAME 2: IMPOSTOR POKÉMON ===================== */
const GRP=[['reg','Regiones'],['tipo','Tipos'],['mt','MT / MO'],['col','Colores'],['esp','Especiales'],['obj','Habilidades y objetos']];
const grpOf=c=>/^reg/.test(c.id)?'reg':/^tipo/.test(c.id)?'tipo':/^mt/.test(c.id)?'mt':/^col/.test(c.id)?'col':['hab','baya','ball'].includes(c.id)?'obj':'esp';
const catWordName=(c,w)=>c.k==='m'?BYID[w].n:w;
function imDeal(st){
  st.rd++;
  const pool=CATS.filter(c=>st.opts.grp.includes(grpOf(c)));
  const cats=pool.length?pool:CATS;
  let cat,w,tries=0;
  do{cat=pick(cats);w=pick(cat.w);tries++}while(st.used.includes(cat.id+':'+w)&&tries<40);
  st.used.push(cat.id+':'+w);
  st.cat=cat.id;st.w=w;
  const act=st.pl.map((p,i)=>i).filter(i=>!st.pl[i].off);
  st.imp=pick(act);
  st.ack=st.pl.map(()=>0);st.cu=0;
  st.order=shuffle(act);st.ci=0;st.cl=st.pl.map(()=>[]);st.vt={};st.res=null;st.er={};st.ph='deal';
}
G.im={
  name:'Impostor Pokémon',min:3,max:10,
  defOpts:{rds:3,cr:1,grp:['reg','tipo','mt','col','esp','obj']},
  init(pl,opts){return {g:'im',ph:'lobby',pl,opts:JSON.parse(JSON.stringify(opts)),rev:0,rd:0,pts:pl.map(()=>0),used:[],cat:'',w:0,imp:0,ack:[],cu:0,order:[],ci:0,cl:[],vt:{},res:null,er:{},loc:0,tEnd:0}},
  start(st,loc){st.rd=0;st.pts=st.pl.map(()=>0);st.used=[];st.loc=loc?1:0;imDeal(st)},
  actor(st){
    if(st.ph==='deal')return st.cu;
    if(st.ph==='clues')return st.order[st.ci%st.order.length];
    if(st.ph==='vote'){for(let i=0;i<st.pl.length;i++)if(!st.pl[i].off&&st.vt[i]===undefined)return i;return 0}
    if(st.ph==='guess')return st.imp;
    return 0;
  },
  leave(st,i){imAdvance(st)},
  reduce(st,a,by){
    const c=CATBY[st.cat];
    if(st.ph==='deal'&&a.t==='ack'){
      if(st.loc&&by!==st.cu)return;
      st.ack[by]=1;if(st.loc)st.cu++;
      imAdvance(st);return;
    }
    if(st.ph==='clues'&&a.t==='clue'){
      if(by!==st.order[st.ci%st.order.length])return;
      let txt=String(a.txt||'').trim().slice(0,24);
      if(!st.loc){
        if(!txt){st.er[by]='Escribe una pista.';return}
        const wn=nz(catWordName(c,st.w));
        if(wn.length>2&&nz(txt).includes(wn)){st.er[by]='No uses la palabra secreta.';return}
      }
      st.er={};st.cl[by].push(txt||'(en voz alta)');st.ci++;
      imAdvance(st);return;
    }
    if(st.ph==='vote'&&a.t==='vote'){
      if(a.tg===by||st.vt[by]!==undefined||!st.pl[a.tg]||st.pl[a.tg].off)return;
      st.vt[by]=a.tg;imAdvance(st);return;
    }
    if(st.ph==='guess'&&a.t==='iguess'){
      if(by!==st.imp)return;
      const ok=c.k==='m'?a.w===st.w:nz(a.w)===nz(st.w);
      imFinish(st,ok?'stolen':'caught',a.w);return;
    }
    if(a.t==='next'&&st.ph==='result'){if(st.rd>=st.opts.rds){st.ph='over'}else imDeal(st)}
  }
};
function imAdvance(st){
  const act=st.pl.map((p,i)=>i).filter(i=>!st.pl[i].off);
  if(st.ph==='deal'){if(act.every(i=>st.ack[i]))st.ph='clues'}
  else if(st.ph==='clues'){
    st.order=st.order.filter(i=>!st.pl[i].off);
    if(!st.order.length||st.ci>=st.order.length*st.opts.cr)st.ph='vote';
  }
  else if(st.ph==='vote'){
    if(act.every(i=>st.vt[i]!==undefined)){
      const cnt={};act.forEach(i=>{const t=st.vt[i];cnt[t]=(cnt[t]||0)+1});
      let max=0,acc=-1,tie=false;
      for(const k in cnt){if(cnt[k]>max){max=cnt[k];acc=+k;tie=false}else if(cnt[k]===max)tie=true}
      if(tie)acc=-1;
      st.acc=acc;
      if(acc===st.imp)st.ph='guess';else imFinish(st,'escaped');
    }
  }
}
function imFinish(st,type,gw){
  const d=st.pl.map(()=>0);
  if(type==='escaped')d[st.imp]=3;
  else if(type==='stolen')d[st.imp]=2;
  else st.pl.forEach((p,i)=>{if(i!==st.imp&&st.vt[i]===st.imp)d[i]=2});
  d.forEach((v,i)=>st.pts[i]+=v);
  st.res={type,d,acc:st.acc,gw:gw===undefined?null:gw};st.ph='result';
}
function imWord(st,big){
  const c=CATBY[st.cat];
  if(c.k==='m'){const m=BYID[st.w];return `<div class="portrait ${big?'lg':''} pop">${mon(m.ai)}</div><div class="big-stamp" style="font-size:${big?'44px':'30px'}">${m.n}</div>`}
  return `<div class="pmd pop" style="min-width:min(100%,280px);text-align:center"><div class="big">${esc(st.w)}</div>${c.ty!==undefined?`<div style="margin-top:8px">${tchip(c.ty,'lg')}</div>`:''}</div>`;
}

  const c=CATBY[st.cat];
  let h=`<div class="ghead"><div><div class="eyebrow">Ronda ${Math.min(st.rd,st.opts.rds)} de ${st.opts.rds}</div><h2>Impostor Pokémon</h2></div><div class="row">${cx.exit}</div></div>`;
  h+=pbar(st,cx,i=>'',i=>String(st.pts[i]||0),st.ph==='clues'?st.order[st.ci%st.order.length]:-1);

  if(st.ph==='deal'){
    const who=cx.loc?st.cu:cx.me;
    if(who<0)return h+`<div class="note">La partida ya comenzó. Puedes mirar desde aquí.</div>`;
    if(!cx.loc&&st.ack[who]){const n=st.ack.filter(Boolean).length;return h+`<div class="win gate"><h3>Carta vista</h3><p class="mute">Esperando a los demás (${n}/${st.pl.filter(p=>!p.off).length})…</p></div>`}
    const p=st.pl[who];
    if(cx.loc&&S.pass!==`deal:${who}`)return h+gateHTML(p,`deal:${who}`,'Se va a mostrar tu carta secreta. Que nadie más mire.');
    const shown=cx.loc||S.ui.card;
    const isImp=who===st.imp;
    h+=`<div class="win stack" style="align-items:center;text-align:center">${catBox.replace('class="pmd"','class="pmd" style="width:100%"')}`;
    if(!shown)h+=`<p class="mute" style="margin:0">Tu carta está oculta.</p><button class="btn" onclick="U('card',1)">Ver mi carta</button>`;
    else if(isImp)h+=`<div class="big-stamp noc pop">¡Eres el impostor!</div><p style="margin:0">No conoces la palabra. Escucha las pistas, disimula y da pistas creíbles.</p>`;
    else h+=`<div class="eyebrow">La palabra secreta es</div>${imWord(st,true)}<p class="mute" style="margin:0">Da pistas sin nombrarla. Cuidado: el impostor escucha.</p>`;
    h+=`<button class="btn ${shown?'':'ghost'}" ${shown?'':'disabled'} onclick="U('card',0);A('ack')">Entendido</button></div>`;

  if(st.ph==='clues'||st.ph==='vote'||st.ph==='guess'){
    h+=catBox;
    h+=`<div class="win stack"><h3>Pistas dadas</h3><div class="clues">`+st.order.map(i=>`<div class="clue"><b>${esc(st.pl[i].n)}</b><span>${st.cl[i].map(esc).join(' · ')||'<i class="mute">—</i>'}</span></div>`).join('')+`</div></div>`;
  }
  if(st.ph==='clues'){
    const cur=st.order[st.ci%st.order.length],p=st.pl[cur],round=Math.floor(st.ci/st.order.length)+1;
    const mineTurn=cx.loc||cx.me===cur;
    h+=`<div class="win stack"><div class="eyebrow">Vuelta ${round} de ${st.opts.cr}</div><h3>${mineTurn&&!cx.loc?'Tu turno de dar una pista':'Turno de '+esc(p.n)}</h3>`;
    if(cx.loc)h+=`<p class="mute" style="margin:0">${esc(p.n)} dice una palabra relacionada en voz alta. Después pulsa «Listo».</p><button class="btn" onclick="A('clue',{txt:''})">Listo, siguiente</button>`;
    else if(mineTurn)h+=`<div class="row"><div class="ac"><input id="clue" type="text" maxlength="24" placeholder="Una palabra relacionada" autocomplete="off" onkeydown="if(event.key==='Enter')sendClue()"></div><button class="btn" onclick="sendClue()">Enviar</button></div>${st.er[cur]?`<div class="note bad">${esc(st.er[cur])}</div>`:''}`;
    else h+=`<p class="mute" style="margin:0">Esperando la pista de ${esc(p.n)}…</p>`;
    h+=`</div>`;
    const me=cx.loc?-1:cx.me;
    if(!cx.loc&&me>=0)h+=`<details class="win soft acc"><summary>Mi carta</summary>${me===st.imp?'<p class="noc"><b>Eres el impostor.</b></p>':imWord(st,false)}</details>`;
    return h;
  }
  if(st.ph==='vote'){
    const who=cx.loc?G.im.actor(st):cx.me;
    if(who<0)return h;
    if(!cx.loc&&st.vt[who]!==undefined){const n=Object.keys(st.vt).length;return h+`<div class="win gate"><h3>Voto enviado</h3><p class="mute">Esperando al resto (${n}/${st.pl.filter(p=>!p.off).length})…</p></div>`}
    if(cx.loc&&S.pass!==`vote:${who}`)return h+gateHTML(st.pl[who],`vote:${who}`,'Es hora de votar en secreto quién crees que es el impostor.');
    h+=`<div class="win stack"><h3>${cx.loc?esc(st.pl[who].n)+', ':''}¿quién es el impostor?</h3><p class="mute" style="margin:0">Discutan y voten. Si hay empate, nadie es expulsado.</p><div class="vgrid">`+
      st.pl.map((p,i)=>i===who||p.off?'':`<button class="vb ${S.ui.v===i?'on':''}" onclick="U('v',${i})">${avatar(p,1)}<b>${esc(p.n)}</b></button>`).join('')+`</div><button class="btn red" ${S.ui.v==null?'disabled':''} onclick="A('vote',{tg:${S.ui.v==null?0:S.ui.v}});S.ui.v=null">Votar</button></div>`;
    return h;
  }
  if(st.ph==='guess'){
    const imp=st.pl[st.imp];
    const mineG=cx.loc||cx.me===st.imp;
    if(mineG&&cx.loc&&S.pass!==`guess:${st.imp}`)return h+gateHTML(imp,`guess:${st.imp}`,'Los demás saben que eres el impostor. Tienes una última oportunidad: adivina la palabra.');
    h+=`<div class="win stack" style="text-align:center;align-items:center"><div class="big-stamp noc">¡${esc(imp.n)} era el impostor!</div>`;
    if(!mineG)h+=`<p class="mute" style="margin:0">Pero tiene una última oportunidad: adivinar la palabra secreta…</p>`;
    else{
      const items=c.w.map((w,i)=>({v:w,l:catWordName(c,w),k:nz(catWordName(c,w)),h:(c.k==='m'?mon(BYID[w].ai)+'<span>'+BYID[w].n+'</span>':'<span>'+esc(w)+'</span>')}));
      h+=`<p style="margin:0">Elige la palabra de «${c.l}»:</p><div class="row" style="width:100%">${acHTML('imguess',items,'Escribe para buscar…')}<button class="btn red" onclick="acSend('imguess','iguess','w')">Adivinar</button></div>`;
    }
    h+=`</div>`;return h;
  }
  if(st.ph==='result'){
    const r=st.res,imp=st.pl[st.imp];
    const title={escaped:'¡El impostor se salvó!',stolen:'¡El impostor adivinó la palabra!',caught:'¡Impostor descubierto!'}[r.type];
    h+=`<div class="win stack" style="align-items:center;text-align:center"><div class="eyebrow">Resultado</div><div class="big-stamp ${r.type==='caught'?'okc':'noc'}">${title}</div>`+
      `<div class="row" style="justify-content:center">${avatar(imp)}<b>${esc(imp.n)}</b><span class="mute">era el impostor</span></div>`+
      `<div class="eyebrow">La palabra era (${c.l})</div>${imWord(st,false)}`+
      (r.gw!==null&&r.type!=='escaped'?`<p class="mute" style="margin:0">El impostor respondió: <b>${esc(c.k==='m'?(BYID[r.gw]?BYID[r.gw].n:'?'):r.gw)}</b></p>`:'')+
      `<div class="sc" style="width:100%;text-align:left">`+st.pl.map((p,i)=>`<div class="res" style="grid-template-columns:auto 1fr auto">${avatar(p,1)}<div><b>${esc(p.n)}</b><div class="mute" style="font-size:13px">${i===st.imp?'Impostor':'Votó a '+(st.vt[i]!==undefined?esc(st.pl[st.vt[i]].n):'—')}</div></div><span class="pts ${r.d[i]?'':'z'}">${r.d[i]?'+'+r.d[i]:'0'}</span></div>`).join('')+`</div>`+
      (cx.host?`<button class="btn" onclick="A('next')">${st.rd>=st.opts.rds?'Ver resultados finales':'Siguiente ronda'}</button>`:`<span class="mute">Esperando al anfitrión…</span>`)+`</div>`;
    return h;
  }
  if(st.ph==='over')return h+podium(st,cx);
  return h;
};
function sendClue(){const v=($('#clue')||{}).value||'';A('clue',{txt:v});}

/* ===================== GAME 3: SINERGIA DE TIPOS ===================== */
const syMatch=(e,a,b)=>a===b?e.t.includes(a):(e.t.includes(a)&&e.t.includes(b));
const syKey=e=>(e.form?'f':'m')+e.id;
function syCount(a,b){let n=0;for(const e of ALL)if(syMatch(e,a,b))n++;return n}
function syPick(st){st.rd++;st.ph='pick';st.pk={};st.cm={};st.an={};st.er={};st.cu=0;st.tEnd=0;st.first=-1}
G.sy={
  name:'Sinergia de tipos',min:2,max:10,
  defOpts:{rds:5,dur:30},
  init(pl,opts){return {g:'sy',ph:'lobby',pl,opts:JSON.parse(JSON.stringify(opts)),rev:0,rd:0,pts:pl.map(()=>0),used:[],pk:{},cm:{},an:{},er:{},cu:0,tEnd:0,first:-1,ex:{},loc:0}},
  start(st,loc){st.rd=0;st.pts=st.pl.map(()=>0);st.used=[];st.loc=loc?1:0;syPick(st)},
  actor(st){
    const act=syAct(st);
    if(st.ph==='pick')return act.find(i=>st.pk[i]===undefined)??0;
    if(st.ph==='answer')return st.cu;
    return 0;
  },
  leave(st,i){syProgress(st)},
  reduce(st,a,by){
    if(st.ph==='pick'&&a.t==='pick'){
      if(st.pk[by]!==undefined||!(a.ty>=0&&a.ty<18)||st.pl[by].off)return;
      st.pk[by]=a.ty;syProgress(st);return;
    }
    if(st.ph==='answer'){
      if(a.t==='timeout'){
        if(!st.tEnd||Date.now()<st.tEnd-80)return;
        if(st.loc){if(!st.an[st.cu])st.an[st.cu]={x:1}}
        else syAct(st).forEach(i=>{if(!st.an[i])st.an[i]={x:1}});
        syProgress(st);return;
      }
      if(st.an[by]||st.cm[by]===undefined)return;
      if(st.loc&&by!==st.cu)return;
      if(a.t==='pass'){st.an[by]={x:1};syProgress(st);return}
      if(a.t==='ans'){
        const e=ALL[a.v];const cm=st.cm[by];
        if(!e){st.er[by]='Elige un Pokémon de la lista.';return}
        if(!syMatch(e,cm[0],cm[1])){st.er[by]=`${e.n} no tiene ${cm[0]===cm[1]?'el tipo '+T[cm[0]]:'los tipos '+T[cm[0]]+' y '+T[cm[1]]}.`;return}
        if(st.used.includes(syKey(e))){st.er[by]=`${e.n} ya se usó en esta partida.`;return}
        let p=1,r=0,s=0;
        if(cm[2]<=3){r=1;p++}
        if(!st.loc&&st.first<0){s=1;p++;st.first=by}
        st.used.push(syKey(e));st.pts[by]+=p;
        st.an[by]={ai:e.ai,nm:e.n,p,r,s};delete st.er[by];
        syProgress(st);return;
      }
    }
    if(a.t==='next'&&st.ph==='result'){if(st.rd>=st.opts.rds)st.ph='over';else syPick(st)}
  }
};
function syAct(st){return st.pl.map((p,i)=>i).filter(i=>!st.pl[i].off)}
function syProgress(st){
  const act=syAct(st);
  if(st.ph==='pick'){
    if(act.length&&act.every(i=>st.pk[i]!==undefined)){
      st.cm={};
      act.forEach((i,k)=>{
        const nx=act[(k+1)%act.length];
        const a=st.pk[i],b=st.pk[nx],n=syCount(a,b);
        st.cm[i]=[a,b,n];
        if(n===0){st.an[i]={z:1,p:1};st.pts[i]+=1}
      });
      st.ph='answer';
      const todo=act.filter(i=>!st.an[i]);
      if(!todo.length){syEnd(st);return}
      st.cu=todo[0];st.tEnd=Date.now()+st.opts.dur*1000;
    }
  }else if(st.ph==='answer'){
    const todo=act.filter(i=>!st.an[i]);
    if(!todo.length){syEnd(st);return}
    if(st.loc){if(st.an[st.cu]||st.pl[st.cu].off){st.cu=todo[0];st.tEnd=Date.now()+st.opts.dur*1000}}
  }
}
function syEnd(st){
  st.ph='result';st.tEnd=0;st.ex={};
  syAct(st).forEach(i=>{
    const cm=st.cm[i];if(!cm)return;
    const ok=ALL.filter(e=>syMatch(e,cm[0],cm[1])&&!(st.an[i]&&st.an[i].nm===e.n));
    st.ex[i]=shuffle(ok).slice(0,4).map(e=>e.ai);
  });
}
G.sy.view=function(st,cx){
  let h=`<div class="ghead"><div><div class="eyebrow">Ronda ${Math.min(st.rd,st.opts.rds)} de ${st.opts.rds}</div><h2>Sinergia de tipos</h2></div><div class="row">${cx.exit}</div></div>`;
  h+=pbar(st,cx,i=>'',i=>String(st.pts[i]||0),st.ph==='answer'&&st.loc?st.cu:-1);
  const act=syAct(st);
  if(st.ph==='pick'){
    const who=cx.loc?G.sy.actor(st):cx.me;
    if(who<0)return h+`<div class="note">La partida ya comenzó. Puedes mirar desde aquí.</div>`;
    if(!cx.loc&&st.pk[who]!==undefined){
      return h+`<div class="win stack" style="align-items:center;text-align:center"><h3>Tipo elegido</h3>${tchip(st.pk[who],'lg')}<p class="mute" style="margin:0">Esperando a: ${act.filter(i=>st.pk[i]===undefined).map(i=>esc(st.pl[i].n)).join(', ')||'…'}</p></div>`;
    }
    if(cx.loc&&S.pass!==`pick:${who}`)return h+gateHTML(st.pl[who],`pick:${who}`,'Elige tu tipo en secreto. Tu reto será tu tipo + el tipo del siguiente jugador.');
    const nxt=act[(act.indexOf(who)+1)%act.length];
    h+=`<div class="win stack"><div class="eyebrow">Elige tu tipo en secreto</div><h3>${cx.loc?esc(st.pl[who].n)+': ':''}tu reto combinará tu tipo con el de ${esc(st.pl[nxt]?st.pl[nxt].n:'?')}</h3><div class="tgrid">`+
      T.map((t,i)=>`<button class="ty lg ${S.ui.ty===i?'on':''}" style="--c:${TC[i]}" onclick="U('ty',${i})">${t}</button>`).join('')+`</div><button class="btn" ${S.ui.ty==null?'disabled':''} onclick="A('pick',{ty:${S.ui.ty==null?0:S.ui.ty}})">Confirmar tipo</button></div>`;
    return h;
  }
  if(st.ph==='answer'){
    const who=cx.loc?st.cu:cx.me;
    const cm=st.cm[who];
    h+=timerHTML(st.tEnd,st.opts.dur*1000);
    if(who<0||!cm){return h+`<div class="note">Mirando la ronda…</div>`+syCombos(st)}
    const done=st.an[who];
    h+=`<div class="win stack"><div class="eyebrow">${cx.loc?esc(st.pl[who].n)+', tu reto':'Tu reto'}</div><div class="combo">${tchip(cm[0],'lg')}${cm[0]!==cm[1]?`<b>+</b>${tchip(cm[1],'lg')}`:''}</div>`+
      `<p class="mute" style="margin:0;text-align:center">${cm[0]===cm[1]?`Escribe cualquier Pokémon de tipo ${T[cm[0]]}.`:`Escribe un Pokémon que tenga los dos tipos.`} Hay ${cm[2]===0?'ninguno':cm[2]} posible${cm[2]===1?'':'s'}${cm[2]>0&&cm[2]<=3?' · ¡combo raro, +1 punto!':''}.</p>`;
    if(done){h+=`<div class="${done.nm?'okc':'mute'}" style="text-align:center"><b>${done.nm?'¡'+esc(done.nm)+' correcto! +'+done.p:done.z?'Combo imposible: punto gratis':'Pasaste'}</b></div>`}
    else{
      const items=ALL.map((e,i)=>({v:i,l:e.n,k:e.nn,h:`${mon(e.ai)}<span>${esc(e.n)}</span>`}));
      h+=`<div class="row">${acHTML('syans',items,'Escribe un Pokémon…')}<button class="btn" onclick="acSend('syans','ans','v')">Enviar</button></div>`;
      if(st.er[who])h+=`<div class="note bad shake">${esc(st.er[who])}</div>`;
      h+=`<button class="btn ghost sm" onclick="A('pass')">Pasar</button>`;
    }
    h+=`</div>`+syCombos(st);
    return h;
  }
  if(st.ph==='result'){
    h+=`<div class="win stack"><div class="eyebrow">Resultados de la ronda</div><div class="sc">`+act.map(i=>{
      const cm=st.cm[i],an=st.an[i]||{},p=st.pl[i];
      return `<div class="res" style="grid-template-columns:auto 1fr auto"><div>${an.ai!==undefined?`<div class="portrait sm">${mon(an.ai)}</div>`:avatar(p,1)}</div><div style="min-width:0"><b>${esc(p.n)}</b> <span class="mute">${an.nm?'→ '+esc(an.nm):an.z?'combo imposible':'sin respuesta'}</span><div class="row" style="gap:6px;margin-top:4px">${tchip(cm[0])}${cm[0]!==cm[1]?'+'+tchip(cm[1]):''}<span class="mute" style="font-size:12px">${cm[2]} posibles</span></div>${an.nm?'':`<div class="exs" style="margin-top:6px">${(st.ex[i]||[]).map(a=>mon(a)).join('')}</div>`}${an.nm?`<div class="mute" style="font-size:12px">${an.r?'Combo raro +1 · ':''}${an.s?'Más rápido +1 · ':''}</div>`:''}</div><span class="pts ${an.p?'':'z'}">${an.p?'+'+an.p:'0'}</span></div>`;
    }).join('')+`</div>${cx.host?`<button class="btn" onclick="A('next')">${st.rd>=st.opts.rds?'Ver resultados finales':'Siguiente ronda'}</button>`:`<span class="mute">Esperando al anfitrión…</span>`}</div>`;
    return h;
  }
  if(st.ph==='over')return h+podium(st,cx);
  return h;
};
function syCombos(st){
  const act=syAct(st);
  return `<div class="win soft stack"><div class="lbl">Retos de la ronda</div>`+act.map(i=>{const cm=st.cm[i],an=st.an[i];return `<div class="row"><b style="min-width:90px;overflow:hidden;text-overflow:ellipsis">${esc(st.pl[i].n)}</b>${tchip(cm[0])}${cm[0]!==cm[1]?'+'+tchip(cm[1]):''}<span class="sp"></span>${an?(an.nm?`<span class="okc">✓ ${esc(an.nm)}</span>`:`<span class="mute">${an.z?'imposible':'pasó'}</span>`):'<span class="mute">pensando…</span>'}</div>`}).join('')+`</div>`;
}

/* ===================== SHARED UI ===================== */
function pbar(st,cx,clsFn,ptsFn,active){
  return `<div class="pbar">`+st.pl.map((p,i)=>`<div class="pp ${i===active?'on':''} ${p.off?'off':''} ${clsFn(i)} ${(!cx.loc&&i===cx.me)?'me':''}" style="--pc:${PC[p.c%PC.length]}">${avatar(p,1)}<b>${esc(p.n)}</b><em>${ptsFn(i)}</em></div>`).join('')+`</div>`;
}
function timerHTML(tEnd,dur){return `<div class="timer" data-end="${tEnd}" data-dur="${dur}"><i></i><span></span></div>`}
function gateHTML(p,key,txt){
  return `<div class="win gate pop">${avatar(p)}<div class="eyebrow">Pasa el dispositivo a</div><h2>${esc(p.n)}</h2><p class="mute" style="margin:0;max-width:34ch">${txt||''}</p><button class="btn" onclick="S.pass='${key}';render()">Soy ${esc(p.n)}</button></div>`;
}
function podium(st,cx){
  const idx=st.pl.map((p,i)=>i).sort((a,b)=>(st.pts[b]||0)-(st.pts[a]||0));
  const top=idx.slice(0,3);const order=top.length===3?[top[1],top[0],top[2]]:top.length===2?[top[1],top[0]]:top;
  const hs={0:150,1:110,2:80};
  const rank=i=>idx.indexOf(i);
  const best=st.pts[idx[0]];
  const winners=idx.filter(i=>st.pts[i]===best);
  return `<div class="win stack" style="align-items:center;text-align:center"><div class="eyebrow">Marcador final</div><div class="big-stamp">${winners.length>1?'¡Empate!':esc(st.pl[idx[0]].n)+' gana'}</div>`+
    `<div class="pod">`+order.map(i=>`<div>${avatar(st.pl[i])}<b>${esc(st.pl[i].n)}</b><div class="step" style="height:${hs[rank(i)]}px">${st.pts[i]||0}</div></div>`).join('')+`</div>`+
    `<div class="row">${cx.host?`<button class="btn" onclick="A('rematch')">Revancha</button>`:`<span class="mute">Esperando al anfitrión…</span>`}${cx.exit}</div></div>`;
}
/* autocomplete */
function acHTML(id,items,ph){
  S.ac[id]=items;
  return `<div class="ac"><input id="${id}" type="text" placeholder="${ph}" autocomplete="off" autocapitalize="off" spellcheck="false" oninput="acIn('${id}')" onkeydown="if(event.key==='Enter')acEnter('${id}')"><div class="acl" id="${id}_l"></div></div>`;
}
function acIn(id,quiet){
  const inp=$('#'+id),L=$('#'+id+'_l');if(!inp||!L)return;
  const q=nz(inp.value);S.ui[id]=null;
  if(id==='gwsearch')S.ui.gid=S.ui.gid;
  if(!q){L.innerHTML='';return}
  const it=S.ac[id]||[];
  const ex=it.find(x=>x.k===q);if(ex)S.ui[id]=ex.v;
  if(quiet&&document.activeElement!==inp){L.innerHTML='';return}
  const res=it.map((x,i)=>[x,i]).filter(([x])=>x.k.includes(q)).sort((a,b)=>(b[0].k.startsWith(q)-a[0].k.startsWith(q))||a[0].k.length-b[0].k.length).slice(0,6);
  L.innerHTML=res.map(([x,i])=>`<button type="button" onclick="acPick('${id}',${i})">${x.h}</button>`).join('');
}
function acPick(id,i){
  const x=S.ac[id][i];const inp=$('#'+id);if(!x||!inp)return;
  inp.value=x.l;S.ui[id]=x.v;if(id==='gwsearch'){S.ui.gid=null;render()}
  else $('#'+id+'_l').innerHTML='';
}
function acEnter(id){const L=$('#'+id+'_l');if(S.ui[id]==null&&L&&L.firstElementChild)L.firstElementChild.click()}
function acSend(id,type,key){
  if(S.ui[id]==null){const L=$('#'+id+'_l');if(L&&L.firstElementChild&&$('#'+id).value){L.firstElementChild.click()}}
  if(S.ui[id]==null){const e=$('#'+id+'_l');if(e)e.innerHTML='<div class="note bad" style="margin:0">Elige una opción de la lista.</div>';return}
  A(type,{[key]:S.ui[id]});
}
/* ===================== DISPATCH ===================== */
function U(k,v){
  S.ui[k]=v;
  if(k==='gid')S.ui.gwsearch=null;
  if(k==='tg'){S.ui.gid=null;S.ui.gwsearch=null;S.ui.showAll=0}
  if(k==='hold'&&v===-1)S.ui.holdSeen=0;
  render();
}
function A(t,p){
  p=p||{};const a=Object.assign({t},p);const g=G[S.game];
  if(S.mode==='local'){applyAct(a,g.actor?g.actor(S.st):0,true)}
  else if(S.role==='host'){applyAct(a,0,true);netPublish()}
  else netSend(a);
  S.ui.q=null;S.ui.gid=null;S.ui.gwsearch=null;S.ui.v=null;S.ui.ty=null;S.ui.showAll=0;
  render();
}
function restartState(st){
  const g=G[S.game];
  const fresh=g.init(st.pl.filter(p=>!p.off).map(p=>Object.assign({},p)),st.opts);
  g.start(fresh,S.mode==='local');
  fresh.rev=st.rev;
  Object.keys(st).forEach(k=>delete st[k]);Object.assign(st,fresh);
}
function applyAct(a,by,isHost){
  const st=S.st,g=G[S.game];if(!st)return;
  const ph0=st.ph,rd0=st.rd;
  if(a.t==='start'){if(isHost&&st.ph==='lobby'&&st.pl.length>=g.min)g.start(st,S.mode==='local')}
  else if(a.t==='opt'){if(isHost&&st.ph==='lobby')st.opts[a.k]=a.v}
  else if(a.t==='rematch'){if(isHost&&(st.ph==='over'))restartState(st)}
  else if(a.t==='next'){if(isHost)g.reduce(st,a,by)}
  else g.reduce(st,a,by);
  if(st.ph!==ph0||st.rd!==rd0){S.pass=null;S.ui.card=0}
  st.rev++;st.now=Date.now();
}

const GAMES=[
 {id:'gw',title:'¿Quién es ese Pokémon?',tag:'Adivina quién',desc:'Cada jugador esconde un Pokémon. Pregunta, descarta y atrapa al de tus rivales antes de que te atrapen a ti.',pl:'2 a 8 jugadores',art:()=>`<span class="q">?</span><i class="mon sil" style="width:112px;margin:0 auto;${posStyle(5)}"></i>`},
 {id:'im',title:'Impostor Pokémon',tag:'Deducción',desc:'Todos conocen la palabra secreta menos uno. Den pistas, descubran al impostor y no se dejen engañar.',pl:'3 a 10 jugadores',art:()=>`${mon(24)}${mon(5)}<span style="position:relative">${mon(93)}</span>`},
 {id:'sy',title:'Sinergia de tipos',tag:'Velocidad',desc:'Cada uno elige un tipo. Tu reto mezcla el tuyo con el del siguiente. Escribe un Pokémon que tenga ambos.',pl:'2 a 10 jugadores',art:()=>`<div style="display:flex;flex-direction:column;align-items:center;gap:6px;padding-bottom:8px"><div class="row" style="gap:6px;justify-content:center">${tchip(9,'lg')}<b style="font:800 26px var(--f-d)">+</b>${tchip(12,'lg')}</div>${mon(5)}</div>`}
];

  `<div class="hero"><h1>Reta a tus amigos.<br><em>Sé el campeón.</em></h1><p>Tres juegos de Pokémon para disfrutar en el mismo dispositivo o en línea con un código de sala.</p></div>`+

const ROW={gw:149};
const RULES={
 gw:['Cada jugador recibe un Pokémon secreto al azar (puedes limitar las regiones).','En tu turno eliges a un rival y le haces una pregunta básica. La app responde SÍ o NO a todos.','El tablero descarta solo los Pokémon imposibles. Lo ves por rival.','Si crees saberlo, adivina. Si aciertas, tu rival queda eliminado. Si fallas, pierdes el turno.','Gana el último jugador en pie.'],
 im:['La app elige una categoría, por ejemplo «Pokémon de Kanto» o «MT/MO de tipo Fuego», y una palabra secreta.','Todos ven la palabra, menos el impostor, que solo ve la categoría.','Por turnos, cada uno da una pista de una palabra. Sin nombrar la secreta.','Voten quién es el impostor. Si lo descubren, él puede salvarse adivinando la palabra.','Puntos: impostor oculto +3, impostor que acierta la palabra +2, quienes lo votaron +2.'],
 sy:['Cada jugador elige en secreto un tipo.','Tu reto combina tu tipo con el del jugador siguiente.','Escribe un Pokémon que tenga ambos tipos antes de que termine el tiempo.','+1 por acierto, +1 si el combo es raro (3 Pokémon o menos), +1 al más rápido en online.','Un Pokémon no se puede repetir durante la partida.']
};
function optsView(game,opts,editable){
  const dis=editable?'':'disabled';
  const seg=(k,vals,fmt)=>`<div class="seg">${vals.map(v=>`<button class="chip ${opts[k]===v?'on':''}" ${dis} onclick="setOpt('${k}',${JSON.stringify(v).replace(/"/g,'&quot;')})">${fmt(v)}</button>`).join('')}</div>`;
  if(game==='gw')return `<div class="field"><label>Regiones en juego</label><div class="seg">${REG.map((r,i)=>`<button class="chip ${opts.gens.includes(i+1)?'on':''}" ${dis} onclick="toggleOpt('gens',${i+1})">${r}</button>`).join('')}</div></div><div class="field"><label>Tiempo por turno</label>${seg('tt',[0,30,60],v=>v?v+' s':'Sin límite')}</div>`;
  if(game==='im')return `<div class="field"><label>Rondas</label>${seg('rds',[3,5,8],v=>v)}</div><div class="field"><label>Vueltas de pistas</label>${seg('cr',[1,2],v=>v)}</div><div class="field"><label>Categorías</label><div class="seg">${GRP.map(([k,n])=>`<button class="chip ${opts.grp.includes(k)?'on':''}" ${dis} onclick="toggleOpt('grp','${k}')">${n}</button>`).join('')}</div></div>`;
  return `<div class="field"><label>Rondas</label>${seg('rds',[3,5,8],v=>v)}</div><div class="field"><label>Tiempo para responder</label>${seg('dur',[20,30,45,60],v=>v+' s')}</div>`;
}
function setOpt(k,v){
  if(S.mode==='setup')S.setup.opts[k]=v;else A('opt',{k,v});
  render();
}
function toggleOpt(k,v){
  const cur=(S.mode==='setup'?S.setup.opts:S.st.opts)[k].slice();
  const i=cur.indexOf(v);if(i>=0){if(cur.length>1)cur.splice(i,1)}else cur.push(v);
  setOpt(k,cur);
}
function setupView(){
  const s=S.setup,g=GAMES.find(x=>x.id===s.game),G_=G[s.game];
  const netOK=!!NET.room;
  let h=`<div class="top"><button class="logo" onclick="goHome()"><span class="bolt"></span>Frente <i>de Batalla</i></button><button class="btn ghost sm" onclick="goHome()">← Volver</button></div>`;
  h+=`<div class="stack"><div><div class="eyebrow">${g.tag} · ${g.pl}</div><h1>${g.title}</h1></div>`;
  h+=`<div class="win stack"><div class="seg"><button class="chip sq ${s.tab==='local'?'on':''}" onclick="S.setup.tab='local';render()">Mismo dispositivo</button><button class="chip sq ${s.tab==='online'?'on':''}" onclick="S.setup.tab='online';render()">Online con código</button></div>`;
  if(s.tab==='local'){
    h+=`<div class="stack"><div class="lbl">Jugadores (${s.names.length})</div>`+s.names.map((n,i)=>`<div class="prow">${avatar({av:AV[i%AV.length],c:i})}<input type="text" maxlength="14" value="${esc(n)}" placeholder="Jugador ${i+1}" oninput="S.setup.names[${i}]=this.value" aria-label="Nombre del jugador ${i+1}">${s.names.length>G_.min?`<button class="btn ghost sm" onclick="rmPlayer(${i})" aria-label="Quitar">✕</button>`:''}</div>`).join('')+
      (s.names.length<G_.max?`<button class="btn ghost sm" style="align-self:flex-start" onclick="addPlayer()">+ Agregar jugador</button>`:'')+`</div>`;
    h+=optsView(s.game,s.opts,true);
    h+=`<button class="btn block" onclick="startLocal()">¡Comenzar duelo!</button><p class="mute" style="margin:0;font-size:14px">Se juega pasándose el celular o el computador. Cuando algo es secreto, la app te avisa a quién pasárselo.</p>`;
  }else{
    if(!netOK)h+=`<div class="note bad">El modo online no está disponible en esta vista. Abre la página desde la plataforma, con tu sesión iniciada, o juega en el mismo dispositivo.</div>`;
    h+=`<div class="field"><label>Tu nombre</label><input type="text" id="myname" maxlength="14" value="${esc(s.me)}" placeholder="Tu nombre" oninput="S.setup.me=this.value;lsSet('pa_name',this.value)"></div>`;
    h+=`<div class="row"><button class="btn sp" ${netOK?'':'disabled'} onclick="createRoom()">Crear sala</button></div><div class="field"><label>O únete con un código</label><div class="row"><input type="text" id="joincode" maxlength="4" value="${esc(s.code)}" placeholder="ABCD" style="max-width:140px;text-transform:uppercase;letter-spacing:.2em;font-weight:800" oninput="S.setup.code=this.value.toUpperCase()"><button class="btn alt" ${netOK?'':'disabled'} onclick="joinRoom()">Unirme</button></div></div>`;
    if(s.err)h+=`<div class="note bad">${esc(s.err)}</div>`;
    if(s.busy)h+=`<div class="note">${esc(s.busy)}</div>`;
    h+=`<p class="mute" style="margin:0;font-size:14px">Todos deben abrir esta misma página. Una persona crea la sala y los demás escriben el código.</p>`;
  }
  h+=`</div><details class="win soft acc"><summary>Cómo se juega</summary><ul>${RULES[s.game].map(r=>`<li>${r}</li>`).join('')}</ul></details></div>`;
  return h;
}
function addPlayer(){const n=S.setup.names;if(n.length<G[S.setup.game].max){n.push('');render()}}
function rmPlayer(i){S.setup.names.splice(i,1);render()}
function lobbyView(){
  const st=S.st,g=G[S.game],gm=GAMES.find(x=>x.id===S.game);
  const host=S.role==='host';
  let h=`<div class="top"><button class="logo" onclick="leaveGame()"><span class="bolt"></span>Frente <i>de Batalla</i></button><button class="btn ghost sm" onclick="leaveGame()">Salir</button></div>`;
  h+=`<div class="stack"><div><div class="eyebrow">${gm.title}</div><h1>Sala de espera</h1></div><div class="win stack"><div class="lbl" style="text-align:center">Código de sala</div><div class="code">${esc(NET.code)}</div><p class="mute" style="margin:0;text-align:center;font-size:14px">Tus amigos escriben este código en «Online con código».</p></div>`;
  h+=`<div class="win stack"><div class="lbl">Jugadores (${st.pl.length}/${g.max})</div><div class="sc">`+st.pl.map((p,i)=>`<div class="res" style="grid-template-columns:auto 1fr auto">${avatar(p,1)}<b>${esc(p.n)}${i===S.me?' (tú)':''}</b>${i===0?'<span class="tag g">Anfitrión</span>':'<span></span>'}</div>`).join('')+`</div></div>`;
  h+=`<div class="win stack"><div class="lbl">Opciones ${host?'':'(las elige el anfitrión)'}</div>${optsView(S.game,st.opts,host)}</div>`;
  if(host)h+=`<button class="btn block" ${st.pl.length<g.min?'disabled':''} onclick="A('start')">${st.pl.length<g.min?`Faltan jugadores (mínimo ${g.min})`:'¡Comenzar duelo!'}</button>`;
  else h+=`<div class="note">Esperando a que el anfitrión comience…</div>`;
  return h+`</div>`;
}
function gameView(){
  const st=S.st,g=G[S.game];
  const cx={loc:S.mode==='local',me:S.me,host:S.mode==='local'||S.role==='host',st};
  cx.exit=S.ui.confirmExit?`<button class="btn red sm" onclick="leaveGame()">Sí, salir</button><button class="btn ghost sm" onclick="U('confirmExit',0)">Seguir</button>`:`<button class="btn ghost sm" onclick="U('confirmExit',1)">Salir</button>`;
  let h=`<div class="top"><button class="logo" onclick="U('confirmExit',1)"><span class="bolt"></span>Frente <i>de Batalla</i></button>${S.mode==='online'&&NET.code?`<span class="tag g">Sala ${esc(NET.code)}</span>`:''}</div>`;
  if(S.mode==='online'&&NET.hostLost&&Date.now()-NET.hostLost>6000)h+=`<div class="note bad">Se perdió la conexión con el anfitrión. Puede que la partida haya terminado.</div>`;
  if(S.mode==='online'&&S.role==='client'&&S.me<0)h+=`<div class="note">Esta partida ya empezó sin ti. Puedes mirar.</div>`;
  h+=`<div class="stack">${g.view(st,cx)}</div>`;
  return h;
}
function render(){
  const app=$('#app');if(!app)return;
  if(S.st&&S.st.rev!==S.lastRev){S.lastRev=S.st.rev;if(S.ui.hold!==undefined&&S.ui.holdRev!==S.st.rev){S.ui.hold=-1}}
  const ae=document.activeElement;const keep={};
  app.querySelectorAll('input[type=text]').forEach(i=>{if(i.id)keep[i.id]=[i.value,i===ae,i.selectionStart]});
  const y=window.scrollY;
  let h;
  if(S.mode==='home')h=homeView();
  else if(S.mode==='setup')h=setupView();
  else if(S.st&&S.st.ph==='lobby')h=lobbyView();
  else if(S.st)h=gameView();
  else h=homeView();
  document.body.classList.toggle('home',S.mode==='home');
  app.innerHTML=h;
  app.classList.toggle('narrow',!(S.mode==='home'||(S.mode!=='setup'&&!S.st)));
  for(const id in keep){const e=document.getElementById(id);if(!e)continue;if(id==='clue'||id==='syans'||id==='imguess'||id==='gwsearch'||id==='myname'||id==='joincode'){e.value=keep[id][0];if(keep[id][1]){e.focus();try{e.setSelectionRange(keep[id][2],keep[id][2])}catch(_){}}if(S.ac[id]&&keep[id][0])acIn(id,true)}}
  window.scrollTo(0,y);
  tick();
}
function tick(){
  document.querySelectorAll('.timer').forEach(t=>{
    const end=+t.dataset.end,dur=+t.dataset.dur;const left=end-(Date.now()+S.off);
    t.firstElementChild.style.transform=`scaleX(${Math.max(0,Math.min(1,left/dur))})`;
    t.lastElementChild.textContent=end?fmtTime(left)+' s':'';
  });
}
function goHome(){if(S.mode==='online'||S.mode==='local')return leaveGame();S.mode='home';S.setup=null;render()}
function openGame(id){
  const G_=G[id];
  S.mode='setup';S.game=id;
  S.setup={game:id,tab:'local',names:['Jugador 1','Jugador 2'].concat(G_.min>2?['Jugador 3']:[]),opts:JSON.parse(JSON.stringify(G_.defOpts)),me:lsGet('pa_name')||'',code:'',err:'',busy:''};
  render();window.scrollTo(0,0);
}
function startLocal(){
  const s=S.setup,g=G[s.game];
  const names=s.names.map((n,i)=>(n||'').trim()||('Jugador '+(i+1)));
  const pl=names.map((n,i)=>({u:'l'+i,n,av:AV[i%AV.length],c:i,off:0}));
  S.mode='local';S.role=null;S.me=-1;S.pass=null;S.ui={};
  S.st=g.init(pl,s.opts);
  g.start(S.st,true);S.st.rev=1;S.st.now=Date.now();
  render();window.scrollTo(0,0);
}

/* ===================== ONLINE (rooms) ===================== */
const NET={room:null,rm:null,code:'',seen:{},seq:0,queue:[],hostLost:0,unsub:null};
(async()=>{try{if(window.claude&&claude.use)NET.room=await claude.use('room')}catch(e){NET.room=null}render()})();
const genCode=()=>{const a='ABCDEFGHJKLMNPQRSTUVWXYZ';let s='';for(let i=0;i<4;i++)s+=a[rnd(a.length)];return s};
const cleanName=n=>String(n||'').replace(/[^\p{L}\p{N} _.-]/gu,'').trim().slice(0,14)||'Jugador';
async function createRoom(){
  const s=S.setup;if(!NET.room)return;
  const name=cleanName(s.me);s.err='';s.busy='Creando sala…';render();
  try{
    let rm=null,code='';
    for(let t=0;t<5;t++){
      code=genCode();rm=await NET.room.join('pk-'+code.toLowerCase());
      await sleep(1400);
      if(rm.peers().some(p=>!p.isMe&&p.presence&&p.presence.h)){await rm.leave();rm=null;continue}
      break;
    }
    if(!rm)throw new Error('No se pudo crear la sala. Intenta de nuevo.');
    NET.rm=rm;NET.code=code;NET.seen={};
    const g=G[s.game];
    S.mode='online';S.role='host';S.me=0;S.ui={};S.off=0;
    S.st=g.init([{u:UID,n:name,av:AV[0],c:0,off:0}],s.opts);S.st.rev=1;S.st.now=Date.now();
    NET.unsub=rm.onPeers(c=>hostSync(c.peers));
    await rm.presence({h:1,u:UID,n:name,s:S.st});
    render();
  }catch(e){s.busy='';s.err=(e&&e.message)||'No se pudo crear la sala.';render()}
}
async function joinRoom(){
  const s=S.setup;if(!NET.room)return;
  const code=(s.code||'').trim().toUpperCase();
  if(code.length!==4){s.err='El código tiene 4 letras.';render();return}
  const name=cleanName(s.me);s.err='';s.busy='Buscando sala…';render();
  try{
    const rm=await NET.room.join('pk-'+code.toLowerCase());
    NET.rm=rm;NET.code=code;NET.seq=0;NET.queue=[];NET.hostLost=0;
    S.mode='online';S.role='client';S.me=-1;S.st=null;S.ui={};S.game=s.game;
    NET.unsub=rm.onPeers(c=>clientSync(c.peers));
    await rm.presence({u:UID,n:name,j:1,q:[]});
    setTimeout(async()=>{
      if(S.mode==='online'&&S.role==='client'&&!S.st){await leaveGame(true);S.mode='setup';S.setup=s;s.busy='';s.err='No encontré esa sala. Revisa el código.';render()}
    },5000);
    render();
  }catch(e){s.busy='';s.err='No pude entrar a la sala.';render()}
}
function hostSync(peers){
  const st=S.st;if(!st)return;let ch=false;const g=G[S.game];
  const present=new Set();
  for(const p of peers){
    const pr=p.presence||{};if(!pr.u)continue;present.add(pr.u);
    if(p.isMe)continue;
    let idx=st.pl.findIndex(x=>x.u===pr.u);
    if(idx<0&&pr.j&&st.ph==='lobby'&&st.pl.length<g.max){
      const k=st.pl.length;
      st.pl.push({u:pr.u,n:cleanName(pr.n),av:AV[k%AV.length],c:k%PC.length,off:0});
      if(st.pts)st.pts.push(0);ch=true;idx=k;
    }
    if(idx<0)continue;
    if(st.pl[idx].off){st.pl[idx].off=0;ch=true}
    const q=Array.isArray(pr.q)?pr.q:[];
    for(const a of q){
      if(a&&a.i>(NET.seen[pr.u]||0)){NET.seen[pr.u]=a.i;
        const act=Object.assign({},a);delete act.i;
        if(typeof act.t==='string'){applyAct(act,idx,false);ch=true}}
    }
  }
  for(let i=st.pl.length-1;i>=1;i--){
    const pl=st.pl[i];
    if(!present.has(pl.u)&&!pl.off){
      if(st.ph==='lobby'){st.pl.splice(i,1);if(st.pts)st.pts.pop()}
      else{pl.off=1;if(g.leave)g.leave(st,i)}
      ch=true;
    }
  }
  if(ch){st.rev++;st.now=Date.now();netPublish(true)}
}
function netPublish(skipRev){
  if(!NET.rm||!S.st)return;
  const st=S.st;
  if(!skipRev){/* A() already bumped rev */}
  NET.rm.presence({s:st}).catch(()=>{});
  render();
}
function netSend(a){
  if(!NET.rm)return;
  NET.seq++;const m=Object.assign({i:NET.seq},a);
  NET.queue.push(m);NET.queue=NET.queue.slice(-4);
  NET.rm.presence({q:NET.queue}).catch(()=>{});
}
function clientSync(peers){
  const h=peers.find(p=>!p.isMe&&p.presence&&p.presence.h&&p.presence.s);
  if(!h){if(!NET.hostLost)NET.hostLost=Date.now();return}
  NET.hostLost=0;
  const s=h.presence.s;
  if(!S.st||s.rev!==S.st.rev||s.g!==S.st.g){
    S.st=JSON.parse(JSON.stringify(s));S.game=S.st.g;
    S.off=(S.st.now||Date.now())-Date.now();
    S.me=S.st.pl.findIndex(p=>p.u===UID);
    render();
  }
}
async function leaveGame(quiet){
  try{if(NET.unsub)NET.unsub();NET.unsub=null;if(NET.rm)await NET.rm.leave()}catch(e){}
  NET.rm=null;NET.code='';NET.hostLost=0;
  S.mode='home';S.st=null;S.role=null;S.me=-1;S.ui={};S.pass=null;S.setup=null;S.off=0;
  if(!quiet)render();
}
/* timers */
setInterval(()=>{
  const st=S.st;
  if(st&&st.tEnd&&(S.mode==='local'||S.role==='host')&&Date.now()>=st.tEnd&&(st.ph==='play'||st.ph==='answer')){
    applyAct({t:'timeout'},-1,true);
    if(S.mode==='online')netPublish();else render();
  }
  tick();
},250);
setInterval(()=>{if(S.mode==='online'&&S.role==='client'&&NET.hostLost&&Date.now()-NET.hostLost>6000)render()},2000);
/* decorative fighters on the home screen */
(()=>{const A=[6,9,3,25,150,448,445,658,282,94,149,130],a=pick(A);let b=pick(A);while(b===a)b=pick(A);
  const fa=$('#fA'),fb=$('#fB');if(fa)fa.innerHTML=mon(a-1);if(fb)fb.innerHTML=mon(b-1);})();
render();
